<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>School Admission Form</title>
</head>
<body>

    <h1>Sunrise Public School Admission Form</h1>
    <p>Please fill in the details below to apply for admission.</p>
    <hr>

    <form>

        <fieldset>
            <legend>Student Details</legend>

            <label>Student Name</label><br>
            <input type="text" id="name" placeholder="Enter student's full name"><br><br>

            <label>Admission ID</label><br>
            <input type="password" id="admission" placeholder="Enter admission ID"><br><br>

            <label>Date of Birth</label><br>
            <input type="date" id="dob"><br>

        </fieldset>

        <br>

        <fieldset>
            <legend>Admission Details</legend>

            <label>Select Class</label><br>
            <select id="class">
                <option value="">-- Select Class --</option>
                <option value="6">Grade 6</option>
                <option value="7">Grade 7</option>
                <option value="8">Grade 8</option>
                <option value="9">Grade 9</option>
                <option value="10">Grade 10</option>
            </select><br><br>

            <label>Preferred Stream</label><br>
            <input type="radio" name="stream" value="science"> Science<br>
            <input type="radio" name="stream" value="commerce"> Commerce<br>
            <input type="radio" name="stream" value="arts"> Arts<br><br>

            <label>Why do you want to join our school?</label><br>
            <textarea id="reason" rows="4" cols="35" placeholder="Write a few lines..."></textarea>

        </fieldset>

        <br>

        <fieldset>
            <legend>Activities Interested In</legend>

            <input type="checkbox" value="sports"> Sports<br>
            <input type="checkbox" value="music"> Music<br>
            <input type="checkbox" value="dance"> Dance<br>
            <input type="checkbox" value="coding"> Coding Club<br>

        </fieldset>

        <br>

        <input type="submit" value="Submit Admission Form">

    </form>

</body>
</html>
