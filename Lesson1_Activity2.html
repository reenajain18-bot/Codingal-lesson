<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> COMMENTS IN HTML</title>
</head>
<body>
    This is a comment in HTML. Comments are used to explain the code and are not displayed in the browser. They are written using the <!-- and --> tags. For example, <!-- This is a comment -->. Comments can be helpful for developers to understand the code better.
    <!-- This is a comment  Add details about your code and logic.-->
</body>
</html>
